global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production
    region: ap-south-1
    cluster: ps-observe-prod

# ================= ALERTING =================

#alerting:
#  alertmanagers:
#    - static_configs:
#        - targets:
#            - "alertmanager:9093"


# ================= RULE FILES =================

#rule_files:
#  - "/etc/prometheus/rules/*.yml"


# ================= SCRAPE CONFIGS =================
scrape_configs:


  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "ps-node-exporter:9100"
        labels:
          server: "local-server"
          metrics_type: "os"
          app: "node-exporter"
          managed_by: "ps-observe"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "ps-cadvisor:8080"
        labels:
          server: "local-server"
          metrics_type: "container"
          app: "cadvisor"
          managed_by: "ps-observe"
